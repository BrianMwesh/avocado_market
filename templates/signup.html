{% extends "base.html" %}
{% block title %}Create buyer account - {{ site_name }}{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>Create a buyer account</h1>
    <p class="muted">Register once to receive formal quotes and invoices for your avocado orders.</p>
    <form method="post" class="stack">
      <label for="full_name">Full name</label>
      <input id="full_name" type="text" name="full_name" value="{{ form.get('full_name','') }}" required
             placeholder="e.g. Jane Wanjiru">

      <label for="email">Email address</label>
      <input id="email" type="email" name="email" value="{{ form.get('email','') }}" required
             placeholder="you@company.co.ke">

      <label for="phone">Phone / WhatsApp</label>
      <input id="phone" type="tel" name="phone" value="{{ form.get('phone','') }}" placeholder="07xx xxx xxx">

      <label for="company">Business name (optional)</label>
      <input id="company" type="text" name="company" value="{{ form.get('company','') }}"
             placeholder="e.g. Green Grocers Ltd">

      <label for="password">Password</label>
      <input id="password" type="password" name="password" required minlength="6"
             placeholder="At least 6 characters">

      <button class="solid-btn full" type="submit">Create account</button>
    </form>
    <p class="muted small">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
  </div>
</section>
{% endblock %}
